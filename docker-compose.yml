# Local development parity (kickoff §6): pgvector Postgres 16, Redis, and a
# filesystem artefact store (services use ARTEFACT_STORE_PATH locally).
# The pg-init script creates login users mirroring the Cloud SQL IAM users so
# the migrations' role-membership grants behave identically here and in prod.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dma_insights
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local
    ports:
      - "5432:5432"
    volumes:
      - ./infra/local/pg-init:/docker-entrypoint-initdb.d:ro
      - dma-pg-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  dma-pg-data:
