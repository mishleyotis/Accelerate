# Slide 14 block offset semantics (applies to every block)
slide_14_block_offsets:
  0: {role: bg_card,      content_type: data,   palette_key: card_bg,    writes: [fill, border]}
  1: {role: accent_strip, content_type: data,   palette_key: accent,     writes: [fill, border]}
  2: {role: cap_name,     content_type: text,   palette_key: null,       writes: [text]}
  3: {role: score,        content_type: text,   palette_key: null,       writes: [text]}
  4: {role: track_bar,    content_type: static, palette_key: null,       writes: [fill, border]}  # fixed #E5E7EB
  5: {role: progress_bar, content_type: data,   palette_key: accent,     writes: [fill, border, width]}
  6: {role: median_line,  content_type: static, palette_key: null,       writes: []}  # cxnSp: x-position only
  7: {role: level_label,  content_type: data,   palette_key: label_text, writes: [text, text_color]}
