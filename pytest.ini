[pytest]
# `pytest apps/mcp apps/api apps/worker` could not COLLECT: two suites hold a
# file called test_subvertical_scope.py, neither directory is a package, and
# prepend import mode derives a module name from the basename alone — so the
# second one collided with the first and the whole run aborted before a single
# test executed. A suite that cannot be run is a suite that is not run.
#
# importlib mode gives each file its own module identity from its path, which
# is what makes same-named tests in sibling services legal. Nothing else about
# collection changes.
addopts = --import-mode=importlib
