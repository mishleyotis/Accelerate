# SearXNG — FSI evidence profile for the DMA Insights evidence engine.
#
# Every key below was verified against docs.searxng.org on 2026-10-10
# (admin/settings/settings_search.html, settings_outgoing.html,
# settings_server.html) and against the pinned image's own
# searx/settings.yml and searx/engines/ on 2026-10-11.
#
# MEASURED 2026-10-11 (live instance + the pinned image run locally): the
# old profile weighted mojeek and startpage, but this SearXNG release marks
# both `inactive: true` (Proof-of-Work CAPTCHA) and `disabled: false` does
# not override that, so neither ran; `use_default_settings: true` without
# `keep_only` then fanned every query to ~57 default general engines, and
# from Cloud Run only Bing answered (10 results, 0 about the entity) —
# Brave and Google CSE suspended for TOO MANY REQUESTS, DuckDuckGo and Qwant
# on CAPTCHA, Google on ACCESS DENIED. From another egress the same Google
# CSE returned 20 on-entity results: it is blocked by RATE, not banned.
#
# So:
#   * keep_only: the engines this profile uses and nothing else. Each query
#     is further narrowed by the evidence engine, which sends it only to
#     the engines with budget left (apps/evidence-engine search.EnginePool:
#     per-engine polite rates, back-off on every unresponsive_engines
#     answer) — no upstream engine ever sees the whole query stream.
#   * no useragent_suffix: it appended "dmai-evidence-engine" to a browser
#     User-Agent, which labels every request automated.
#   * google (access denied at any rate from datacentre egress), mojeek,
#     startpage and yep (PoW CAPTCHA / access denied) are left out.
#   * free and keyless only (owner, 2026-10-11: "avoid paid APIs"): Bing
#     News and DuckDuckGo News join the rotation — both answered 4/4 about
#     the entity while DuckDuckGo web search was on CAPTCHA; GDELT (429 per
#     shared IP), Google News (access denied) and Brave News (engine crash)
#     were measured and left out.
#   * suspended_times give a blocked engine a measured cool-off instead of
#     the default day-long suspension.
use_default_settings: true`), so only the deltas are stated.
#
# Why these choices (brief §6b):
#   * Google and Bing block datacentre egress within hours; the profile
#     weights engines that tolerate automated use (mojeek, brave, duckduckgo,
#     qwant, startpage) and the academic engines the engine falls back to.
#   * suspended_times give a blocked engine a measured cool-off instead of
#     the default day-long suspension, so a transient 429 does not remove
#     an engine for 24h.
#   * outgoing.max_request_timeout 12 (the brief) over the 10.0 default:
#     regulator sites are slow.
#   * The JSON format is what the engine consumes; html stays for the
#     instance's own page behind the gateway.
use_default_settings:
  engines:
    keep_only:
      - google cse
      - bing
      - brave
      - duckduckgo
      - qwant
      - mwmbl
      - wikipedia
      - wikidata
      - bing news
      - brave.news
      - duckduckgo news
      - arxiv
      - semantic scholar
      - openalex
      - crossref

general:
  debug: false
  instance_name: "dmai-searxng"
  enable_metrics: true

server:
  port: 8080
  bind_address: "127.0.0.1"          # never exposed directly; Supergateway / the engine sit in front
  # secret_key: injected at run time as the SEARXNG_SECRET environment
  # variable (the documented override) from Secret Manager; never in a file.
  limiter: false                      # single trusted caller (the engine); the engine rate-limits
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en-US"
  max_page: 3
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json
  # Engine suspension after an error, in seconds. Defaults are 86400 /
  # 86400 / 3600; a day-long suspension for one 403 empties the pool.
  suspended_times:
    SearxEngineAccessDenied: 1800
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 900
    cf_SearxEngineCaptcha: 7200
    cf_SearxEngineAccessDenied: 3600
    recaptcha_SearxEngineCaptcha: 21600

outgoing:
  request_timeout: 4.0
  max_request_timeout: 12.0
  pool_connections: 50
  pool_maxsize: 20
  enable_http2: true
  # proxies: intentionally absent (brief §6c: a paid proxy is an owner decision)

engines:
  # ── general web (rate-paced per engine by the evidence engine) ──
  - name: google cse
    disabled: false
    weight: 1.5
  - name: bing
    disabled: false
    weight: 1.0
  - name: brave
    disabled: false
    weight: 1.2
  - name: mwmbl
    disabled: false
    weight: 1.0
  - name: duckduckgo
    disabled: false
    weight: 0.8
  - name: qwant
    disabled: false
    weight: 0.6
  - name: wikipedia
    disabled: false
    weight: 0.5
  # ── news ──
  - name: bing news
    disabled: false
    weight: 1.0
  - name: brave.news
    disabled: false
    weight: 1.0
  - name: duckduckgo news
    disabled: false
    weight: 0.8
  # ── academic (brief §6b academic chain) ──
  - name: arxiv
    disabled: false
  - name: semantic scholar
    disabled: false
  - name: openalex
    disabled: false
  - name: crossref
    disabled: false
