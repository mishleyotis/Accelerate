[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# `+psycopg` pins SQLAlchemy onto the psycopg3 driver (only one
# installed in the backend image — bare `postgresql://` defaults to
# psycopg2 in SQLAlchemy 2.0 and bombs with ModuleNotFoundError).
sqlalchemy.url = postgresql+psycopg://dma_insights:dma_insights_local@localhost:5433/dma_insights

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
